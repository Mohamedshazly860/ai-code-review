name: Deploy to HuggingFace

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "mohamedshazly860@gmail.com"
          git config user.name "Mohamed Shazly"
          git push https://mohamedshazly860:$HF_TOKEN@huggingface.co/spaces/mohamedshazly860/devinsight-backend main --force